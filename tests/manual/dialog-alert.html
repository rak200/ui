<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>An alert dialog, heard</title>
        <!--
            What a screen reader says of a <ui-dialog alert> as it opens, beside a <ui-dialog>
            that is not one (#457).

            A step, not a test: no engine the suite drives is a screen reader, so what a reader
            hears there is measured by a person, with the screen readers readers use. It lives in
            tests/manual/ for the reasons interaction-states.mjs gives beside it.

            ## Running it

                npm run workbench -- --host

            Then open /tests/manual/dialog-alert.html at the network address Vite prints, on each
            device. The page imports the package from src/, as a scratch page does, and has none of
            the workbench's shell, which a screen reader would read along with it.

            ## The pairs

            NVDA with Firefox and with Chrome, and JAWS with Chrome, on Windows; VoiceOver with
            Safari, on macOS and on iOS; TalkBack with Chrome, on Android.

            ## Each case

            Put the focus on the case's button and press it; on a phone, double-tap it. Then write
            down, word for word, what is announced as the dialog opens, and what is announced as it
            closes and the focus comes back to the button.

            - Case 1: a dialog, which is not an alert, for comparison.
            - Case 2: the same dialog as an alert. Whether it is announced as an alert, or an alert
              dialog, and whether its message is read without moving through it.
            - Case 3: the alert again, closed with Escape rather than with a button.

            ## Where it goes

            A comment on #457, with the version of the screen reader, the browser and the system.
            An alert announced as a plain dialog in a pair is a finding to record, not a defect of
            the element, which writes the role; a dialog left without its name is a defect.
        -->
        <script type="module">
            import '@rak200/ui';
        </script>
        <style>
            body {
                margin: 0;
                padding: 1rem;
                font-family: system-ui, sans-serif;
            }

            section {
                display: grid;
                gap: 0.5rem;
                justify-items: start;
                margin-block-end: 2rem;
            }

            h2 {
                margin: 0;
                font-size: 1.125rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>An alert dialog, heard</h1>

            <section>
                <h2>Case 1: a dialog</h2>
                <button type="button" commandfor="plain" command="--show">
                    Archive the project
                </button>
                <ui-dialog id="plain">
                    <h3 slot="title">Archive the project</h3>
                    <p>It leaves the list, and comes back from the archive whenever you like.</p>
                    <button slot="actions" type="button" commandfor="plain" command="--close">
                        Cancel
                    </button>
                    <button slot="actions" type="button" commandfor="plain" command="--close">
                        Archive
                    </button>
                </ui-dialog>
            </section>

            <section>
                <h2>Case 2 and case 3: an alert</h2>
                <button type="button" commandfor="alerting" command="--show">
                    Delete the project
                </button>
                <ui-dialog id="alerting" alert>
                    <h3 slot="title">Delete the project</h3>
                    <p>This cannot be undone. Every file in it goes with it.</p>
                    <button slot="actions" type="button" commandfor="alerting" command="--close">
                        Cancel
                    </button>
                    <button slot="actions" type="button" commandfor="alerting" command="--close">
                        Delete
                    </button>
                </ui-dialog>
            </section>
        </main>
    </body>
</html>
