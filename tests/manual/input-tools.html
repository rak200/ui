<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>A field's count and its buttons, heard</title>
        <!--
            What a screen reader says of a <ui-input>'s count, its clear button and its password
            button (#445).

            A step, not a test: no engine the suite drives is a screen reader, so what a reader
            hears there is measured by a person, with the screen readers readers use. It lives in
            tests/manual/ for the reasons interaction-states.mjs gives beside it.

            ## Running it

                npm run workbench -- --host

            Then open /tests/manual/input-tools.html at the network address Vite prints, on each
            device. The page imports the package from src/, as a scratch page does, and has none of
            the workbench's shell, which a screen reader would read along with it.

            ## The pairs

            NVDA with Firefox and with Chrome, and JAWS with Chrome, on Windows; VoiceOver with
            Safari, on macOS and on iOS; TalkBack with Chrome, on Android.

            ## Each case

            Put the focus on the button before a case and press Tab; on a phone, swipe to the next
            item from the button. Then write down, word for word:

            - Case 1: what is announced as the focus lands on the field, the count among it; then
              type a word quickly and stop. Whether anything is said at each letter, and what is
              said once you stop, and how long after.
            - Case 2: type something, then Tab to the clear button. What it is announced as, and,
              pressed, where the focus goes and what is said there.
            - Case 3: type a password, then Tab to the password's button. What it is announced as,
              pressed and not, and what is read of the field once its text is shown.

            ## Where it goes

            A comment on #445, with the version of the screen reader, the browser and the system.
            What the cases decide is written there: a count said at each letter, or never, moves
            its wait; a button announced without its state, or a field read out while its text is
            hidden, is a defect of its own.
        -->
        <script type="module">
            import '@rak200/ui';
        </script>
        <style>
            body {
                margin: 0;
                padding: 1rem;
                font-family: system-ui, sans-serif;
            }

            section {
                display: grid;
                gap: 0.5rem;
                max-inline-size: 24rem;
                margin-block-end: 2rem;
            }

            h2 {
                margin: 0;
                font-size: 1.125rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>A field's count and its buttons, heard</h1>

            <section>
                <h2>Case 1: the count</h2>
                <button type="button">Before case 1</button>
                <ui-input
                    label="Headline"
                    name="headline"
                    maxlength="60"
                    help="Shown above the article."
                    count-text="{remaining} characters left"
                ></ui-input>
            </section>

            <section>
                <h2>Case 2: the clear button</h2>
                <button type="button">Before case 2</button>
                <ui-input label="Search" name="q" type="search" clear-label="Clear"></ui-input>
            </section>

            <section>
                <h2>Case 3: the password's button</h2>
                <button type="button">Before case 3</button>
                <ui-input
                    label="Password"
                    name="password"
                    type="password"
                    reveal-label="Show password"
                ></ui-input>
            </section>
        </main>
    </body>
</html>
